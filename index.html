<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Launcher - Square Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* MENU PRINCIPAL */
        #mainMenu {
            display: block;
        }
        
        #mainMenu.hidden {
            display: none;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }
        
        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 18px;
            opacity: 0.9;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .game-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .game-thumbnail {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 60px;
        }
        
        .game-info {
            padding: 20px;
        }
        
        .game-info h3 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .game-info p {
            color: #666;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .game-buttons {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            font-size: 14px;
        }
        
        .btn-play {
            background: #667eea;
            color: white;
        }
        
        .btn-play:hover {
            background: #5568d3;
        }
        
        .btn-edit {
            background: #48bb78;
            color: white;
        }
        
        .btn-edit:hover {
            background: #38a169;
        }
        
        .btn-back {
            background: #e53e3e;
            color: white;
        }
        
        .btn-back:hover {
            background: #c53030;
        }
        
        /* GAME CONTAINER */
        #gameContainer {
            display: none;
            background: black;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        #gameContainer.active {
            display: block;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        
        .game-controls {
            background: white;
            padding: 20px;
            border-radius: 0 0 15px 15px;
            text-align: center;
        }
        
        .game-controls p {
            color: #666;
            margin-bottom: 15px;
        }
        
        /* EDITOR */
        #editorPanel {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        #editorPanel.active {
            display: block;
        }
        
        .editor-header {
            margin-bottom: 30px;
        }
        
        .editor-header h2 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .editor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .editor-item {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
        }
        
        .editor-item label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }
        
        .editor-item input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .editor-item input[type="color"] {
            height: 50px;
            cursor: pointer;
        }
        
        .editor-item input[type="range"] {
            width: 100%;
        }
        
        .editor-value {
            margin-top: 5px;
            color: #666;
            font-size: 12px;
        }
        
        .editor-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .editor-buttons button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }
        
        .btn-save {
            background: #48bb78;
            color: white;
        }
        
        .btn-save:hover {
            background: #38a169;
        }
        
        .btn-cancel {
            background: #cbd5e0;
            color: #333;
        }
        
        .btn-cancel:hover {
            background: #a0aec0;
        }
        
        /* PREVIEW */
        .preview-container {
            margin-top: 30px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
        }
        
        .preview-container h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        #previewCanvas {
            width: 100%;
            max-width: 600px;
            height: auto;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            background: #87ceeb;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- MENU PRINCIPAL -->
        <div id="mainMenu">
            <div class="header">
                <h1>🎮 Game Launcher</h1>
                <p>Selecione um jogo para jogar ou editar</p>
            </div>
            
            <div class="games-grid" id="gamesGrid"></div>
        </div>
        
        <!-- GAME CONTAINER -->
        <div id="gameContainer"></div>
        <div class="game-controls" id="gameControls" style="display: none;">
            <p>Use <strong>WASD</strong> ou <strong>Setas</strong> para mover | <strong>ESPAÇO</strong> para pular</p>
            <button class="btn-back" onclick="backToMenu()">← Voltar ao Menu</button>
        </div>
        
        <!-- EDITOR PANEL -->
        <div id="editorPanel">
            <div class="editor-header">
                <h2 id="editorTitle">Editar Jogo</h2>
                <p id="editorDescription"></p>
            </div>
            
            <div class="editor-grid" id="editorGrid"></div>
            
            <div class="preview-container">
                <h3>Preview</h3>
                <canvas id="previewCanvas" width="600" height="400"></canvas>
            </div>
            
            <div class="editor-buttons">
                <button class="btn-save" onclick="saveGameConfig()">💾 Salvar Alterações</button>
                <button class="btn-cancel" onclick="cancelEdit()">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <script>
        // Configurações dos jogos
        const gamesConfig = [
            {
                id: 'blue-ball',
                name: 'Blue Ball Platformer',
                description: 'Pule sobre as plataformas com a bola azul',
                emoji: '🔵',
                settings: {
                    playerColor: '#0000ff',
                    platformColor: '#8b7355',
                    backgroundColor: '#87ceeb',
                    gravity: 1050,
                    playerSpeed: 400,
                    jumpForce: 717,
                    platformCount: 3,
                    difficulty: 'normal'
                }
            }
        ];

        let currentGame = null;
        let gameInstance = null;
        let editingGame = null;

        // Renderizar grid de jogos
        function renderGamesGrid() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            gamesConfig.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-thumbnail">${game.emoji}</div>
                    <div class="game-info">
                        <h3>${game.name}</h3>
                        <p>${game.description}</p>
                        <div class="game-buttons">
                            <button class="btn-play" onclick="playGame('${game.id}')">▶ Jogar</button>
                            <button class="btn-edit" onclick="editGame('${game.id}')">✎ Editar</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Jogar jogo
        function playGame(gameId) {
            currentGame = gamesConfig.find(g => g.id === gameId);
            if (!currentGame) return;

            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameContainer').classList.add('active');
            document.getElementById('gameControls').style.display = 'block';

            if (gameInstance) {
                gameInstance.destroy(true);
                gameInstance = null;
            }

            const config = {
                type: Phaser.AUTO,
                width: 1280,
                height: 720,
                parent: 'gameContainer',
                physics: {
                    default: 'arcade',
                    arcade: {
                        gravity: { y: currentGame.settings.gravity },
                        debug: false,
                    },
                },
                scene: {
                    preload: preload,
                    create: create,
                    update: update,
                },
            };

            gameInstance = new Phaser.Game(config);
        }

        // Phaser Functions
        function preload() {
            // Criar texturas dinamicamente para evitar erro de Base64/Data URI
            let graphics = this.make.graphics({ x: 0, y: 0, add: false });
            
            // Textura do jogador (Círculo)
            graphics.fillStyle(0xffffff); // Branco por padrão, mudaremos com setTint
            graphics.fillCircle(30, 30, 30);
            graphics.generateTexture('playerTexture', 60, 60);
            graphics.clear();
            
            // Textura da plataforma (Retângulo)
            graphics.fillStyle(0xffffff);
            graphics.fillRect(0, 0, 100, 20);
            graphics.generateTexture('platformTexture', 100, 20);
        }

        function create() {
            const settings = currentGame.settings;
            const platforms = this.physics.add.staticGroup();
            const worldWidth = 1280;
            const worldHeight = 720;

            // Chão
            for (let x = 0; x < worldWidth; x += 100) {
                platforms.create(x, worldHeight - 20, 'platformTexture')
                    .setOrigin(0, 0)
                    .refreshBody()
                    .setTint(Phaser.Display.Color.HexStringToColor(settings.platformColor).color);
            }

            // Plataformas aleatórias
            for (let i = 0; i < settings.platformCount; i++) {
                const x = 200 + Math.random() * (worldWidth - 400);
                const y = 200 + Math.random() * (worldHeight - 400);
                platforms.create(x, y, 'platformTexture')
                    .setOrigin(0, 0)
                    .refreshBody()
                    .setTint(Phaser.Display.Color.HexStringToColor(settings.platformColor).color);
            }

            const player = this.physics.add.sprite(100, 450, 'playerTexture');
            player.setBounce(0.1);
            player.setCollideWorldBounds(true);
            player.setTint(Phaser.Display.Color.HexStringToColor(settings.playerColor).color);
            this.player = player;

            this.physics.add.collider(player, platforms);

            this.cursors = this.input.keyboard.createCursorKeys();
            this.keys = this.input.keyboard.addKeys('W,A,S,D,SPACE');

            this.cameras.main.setBackgroundColor(settings.backgroundColor);
            this.cameras.main.setBounds(0, 0, worldWidth, worldHeight);
            this.cameras.main.startFollow(player);
        }

        function update() {
            if (!this.player) return;

            const player = this.player;
            const keys = this.keys;
            const cursors = this.cursors;
            const settings = currentGame.settings;

            if (keys.A.isDown || cursors.left.isDown) {
                player.setVelocityX(-settings.playerSpeed);
            } else if (keys.D.isDown || cursors.right.isDown) {
                player.setVelocityX(settings.playerSpeed);
            } else {
                player.setVelocityX(0);
            }

            if ((keys.SPACE.isDown || cursors.up.isDown || keys.W.isDown) && player.body.touching.down) {
                player.setVelocityY(-settings.jumpForce);
            }
        }

        // Editar jogo
        function editGame(gameId) {
            editingGame = gamesConfig.find(g => g.id === gameId);
            if (!editingGame) return;

            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('editorPanel').classList.add('active');
            document.getElementById('editorTitle').textContent = `Editar: ${editingGame.name}`;
            document.getElementById('editorDescription').textContent = `Customize as configurações do seu jogo`;

            renderEditorGrid();
            updatePreview();
        }

        // Renderizar grid do editor
        function renderEditorGrid() {
            const grid = document.getElementById('editorGrid');
            grid.innerHTML = '';

            const settings = editingGame.settings;

            // Cor do jogador
            grid.innerHTML += `
                <div class="editor-item">
                    <label>Cor do Jogador</label>
                    <input type="color" id="playerColor" value="${settings.playerColor}" onchange="updatePreview()">
                </div>
            `;

            // Cor da plataforma
            grid.innerHTML += `
                <div class="editor-item">
                    <label>Cor da Plataforma</label>
                    <input type="color" id="platformColor" value="${settings.platformColor}" onchange="updatePreview()">
                </div>
            `;

            // Cor do fundo
            grid.innerHTML += `
                <div class="editor-item">
                    <label>Cor do Fundo</label>
                    <input type="color" id="backgroundColor" value="${settings.backgroundColor}" onchange="updatePreview()">
                </div>
            `;

            // Gravidade
            grid.innerHTML += `
                <div class="editor-item">
                    <label>Gravidade</label>
                    <input type="range" id="gravity" min="500" max="2000" value="${settings.gravity}" onchange="updatePreview()">
                    <div class="editor-value">Valor: <span id="gravityValue">${settings.gravity}</span></div>
                </div>
            `;

            // Velocidade do jogador
            grid.innerHTML += `
                <div class="editor-item">
                    <label>Velocidade do Jogador</label>
                    <input type="range" id="playerSpeed" min="200" max="800" value="${settings.playerSpeed}" onchange="updatePreview()">
                    <div class="editor-value">Valor: <span id="playerSpeedValue">${settings.playerSpeed}</span></div>
                </div>
            `;

            // Força do pulo
            grid.innerHTML += `
                <div class="editor-item">
                    <label>Força do Pulo</label>
                    <input type="range" id="jumpForce" min="400" max="1000" value="${settings.jumpForce}" onchange="updatePreview()">
                    <div class="editor-value">Valor: <span id="jumpForceValue">${settings.jumpForce}</span></div>
                </div>
            `;

            // Dificuldade
            grid.innerHTML += `
                <div class="editor-item">
                    <label>Dificuldade</label>
                    <select id="difficulty" onchange="updatePreview()" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 5px;">
                        <option value="easy" ${settings.difficulty === 'easy' ? 'selected' : ''}>Fácil</option>
                        <option value="normal" ${settings.difficulty === 'normal' ? 'selected' : ''}>Normal</option>
                        <option value="hard" ${settings.difficulty === 'hard' ? 'selected' : ''}>Difícil</option>
                    </select>
                </div>
            `;

            // Adicionar listeners para atualizar valores
            document.getElementById('gravity').addEventListener('input', (e) => {
                document.getElementById('gravityValue').textContent = e.target.value;
            });
            document.getElementById('playerSpeed').addEventListener('input', (e) => {
                document.getElementById('playerSpeedValue').textContent = e.target.value;
            });
            document.getElementById('jumpForce').addEventListener('input', (e) => {
                document.getElementById('jumpForceValue').textContent = e.target.value;
            });
        }

        // Atualizar preview
        function updatePreview() {
            const canvas = document.getElementById('previewCanvas');
            const ctx = canvas.getContext('2d');

            const playerColor = document.getElementById('playerColor').value;
            const platformColor = document.getElementById('platformColor').value;
            const backgroundColor = document.getElementById('backgroundColor').value;

            // Desenhar fundo
            ctx.fillStyle = backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenhar plataformas
            ctx.fillStyle = platformColor;
            ctx.fillRect(50, 300, 200, 30);
            ctx.fillRect(350, 250, 200, 30);

            // Desenhar jogador
            ctx.fillStyle = playerColor;
            ctx.beginPath();
            ctx.arc(100, 150, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        // Salvar configurações
        function saveGameConfig() {
            if (!editingGame) return;

            editingGame.settings.playerColor = document.getElementById('playerColor').value;
            editingGame.settings.platformColor = document.getElementById('platformColor').value;
            editingGame.settings.backgroundColor = document.getElementById('backgroundColor').value;
            editingGame.settings.gravity = parseInt(document.getElementById('gravity').value);
            editingGame.settings.playerSpeed = parseInt(document.getElementById('playerSpeed').value);
            editingGame.settings.jumpForce = parseInt(document.getElementById('jumpForce').value);
            editingGame.settings.difficulty = document.getElementById('difficulty').value;

            alert('✅ Configurações salvas! Agora você pode jogar com as novas configurações.');
            cancelEdit();
        }

        // Cancelar edição
        function cancelEdit() {
            document.getElementById('editorPanel').classList.remove('active');
            document.getElementById('mainMenu').classList.remove('hidden');
            editingGame = null;
        }

        // Voltar ao menu
        function backToMenu() {
            document.getElementById('gameContainer').classList.remove('active');
            document.getElementById('gameControls').style.display = 'none';
            document.getElementById('mainMenu').classList.remove('hidden');

            if (gameInstance) {
                gameInstance.destroy(true);
                gameInstance = null;
            }
        }

        // Inicializar
        renderGamesGrid();
    </script>
</body>
</html>
