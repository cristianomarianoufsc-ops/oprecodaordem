<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Launcher - Square Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* MENU PRINCIPAL */
        #mainMenu {
            display: block;
        }
        
        #mainMenu.hidden {
            display: none;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            padding-top: 10px;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 15px;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .game-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .game-thumbnail {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 50px;
        }
        
        .game-info {
            padding: 15px;
        }
        
        .game-info h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #333;
        }
        
        .game-info p {
            color: #666;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .game-buttons {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            font-size: 14px;
            touch-action: manipulation;
        }
        
        .btn-play {
            background: #667eea;
            color: white;
        }
        
        .btn-play:hover {
            background: #5568d3;
        }
        
        .btn-edit {
            background: #48bb78;
            color: white;
        }
        
        .btn-edit:hover {
            background: #38a169;
        }
        
        .btn-assets {
            background: #ed8936;
            color: white;
            margin: 10px auto;
            width: 90%;
            max-width: 300px;
            display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .btn-assets:hover {
            background: #dd6b20;
        }
        
        .btn-back {
            background: #e53e3e;
            color: white;
            margin-top: 10px;
        }
        
        /* ASSETS PANEL */
        #assetsPanel {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            width: 100%;
        }
        
        #assetsPanel.active {
            display: block;
        }
        
        .asset-upload-area {
            border: 2px dashed #cbd5e0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: border-color 0.3s;
            background: #f7fafc;
        }
        
        .asset-upload-area:hover {
            border-color: #667eea;
        }
        
        .asset-preview-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .asset-item {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 5px;
            text-align: center;
            background: white;
        }
        
        .asset-item img {
            width: 100%;
            height: 60px;
            object-fit: contain;
            background: #f7fafc;
            border-radius: 5px;
        }
        
        .asset-item span {
            font-size: 10px;
            display: block;
            margin-top: 5px;
            color: #333;
            font-weight: bold;
            word-break: break-all;
        }
        
        .btn-remove-asset {
            background: #e53e3e;
            color: white;
            padding: 6px;
            font-size: 10px;
            margin-top: 5px;
            width: 100%;
            border-radius: 4px;
        }
        
        /* GAME CONTAINER */
        #gameContainer {
            display: none;
            background: black;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            margin: 0 auto 10px;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16/9;
        }
        
        #gameContainer.active {
            display: block;
        }
        
        canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }
        
        .game-ui {
            background: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            max-width: 1280px;
            margin: 0 auto;
        }
        
        /* MOBILE CONTROLS */
        #mobileControls {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            z-index: 1000;
            justify-content: space-between;
            pointer-events: none;
        }
        
        .mobile-btn-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        
        .m-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            backdrop-filter: blur(5px);
            -webkit-tap-highlight-color: transparent;
        }
        
        .m-btn:active {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(0.9);
        }
        
        @media (max-width: 768px) {
            #mobileControls.active {
                display: flex;
            }
            .header h1 {
                font-size: 24px;
            }
            .header p {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- MENU PRINCIPAL -->
        <div id="mainMenu">
            <div class="header">
                <h1>🎮 Game Launcher</h1>
                <p>Selecione um jogo para jogar ou editar</p>
                <button class="btn-assets" onclick="toggleAssetsPanel()">📤 Upload de Sprites</button>
            </div>
            
            <!-- ASSETS PANEL -->
            <div id="assetsPanel">
                <h3 style="margin-bottom: 10px;">Gerenciador de Assets</h3>
                <p style="font-size: 12px; color: #666; margin-bottom: 15px;">
                    Para substituir o jogador no Custom Platformer, use o nome <strong>player</strong>.
                </p>
                <div class="asset-upload-area" onclick="document.getElementById('assetInput').click()">
                    <span style="font-size: 14px; color: #333; font-weight: bold;">Clique para selecionar imagens</span>
                    <input type="file" id="assetInput" style="display: none" accept="image/*" multiple onchange="handleAssetUpload(event)">
                </div>
                <div class="asset-preview-list" id="assetPreviewList"></div>
                <button class="btn-back" onclick="toggleAssetsPanel()" style="width: 100%;">Fechar Gerenciador</button>
            </div>

            <div class="games-grid" id="gamesGrid"></div>
        </div>
        
        <!-- GAME AREA -->
        <div id="gameContainer"></div>
        <div class="game-ui" id="gameUI" style="display: none;">
            <p style="font-size: 14px; color: #666; margin-bottom: 10px;">Controles Mobile ativos na tela</p>
            <button class="btn-back" onclick="backToMenu()" style="width: 100%;">← Voltar ao Menu</button>
        </div>
        
        <!-- MOBILE CONTROLS -->
        <div id="mobileControls">
            <div class="mobile-btn-group">
                <div class="m-btn" id="btnLeft">⬅️</div>
                <div class="m-btn" id="btnRight">➡️</div>
            </div>
            <div class="mobile-btn-group">
                <div class="m-btn" id="btnJump">⬆️</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <script>
        const gamesConfig = [
            {
                id: 'blue-ball',
                name: 'Blue Ball Platformer',
                description: 'Pule sobre as plataformas com a bola azul (Original)',
                emoji: '🔵',
                type: 'ball',
                settings: {
                    playerColor: '#0000ff',
                    platformColor: '#8b7355',
                    backgroundColor: '#87ceeb',
                    gravity: 1050,
                    playerSpeed: 400,
                    jumpForce: 717,
                    platformCount: 3
                }
            },
            {
                id: 'custom-game',
                name: 'Custom Platformer',
                description: 'Uma cópia com Boneco Palito ou seu Sprite customizado!',
                emoji: '🛠️',
                type: 'stickman',
                settings: {
                    playerColor: '#ff0000',
                    platformColor: '#4a5568',
                    backgroundColor: '#a0aec0',
                    gravity: 1050,
                    playerSpeed: 400,
                    jumpForce: 717,
                    platformCount: 5
                }
            }
        ];

        let currentGame = null;
        let gameInstance = null;
        let customAssets = JSON.parse(localStorage.getItem('customAssets') || '{}');
        const mobileState = { left: false, right: false, jump: false };

        // --- ASSETS LOGIC ---
        function toggleAssetsPanel() {
            const panel = document.getElementById('assetsPanel');
            panel.classList.toggle('active');
            renderAssetPreviews();
            if (panel.classList.contains('active')) {
                panel.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function handleAssetUpload(event) {
            const files = event.target.files;
            if (!files.length) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const name = file.name.split('.')[0].toLowerCase();
                    customAssets[name] = e.target.result;
                    localStorage.setItem('customAssets', JSON.stringify(customAssets));
                    renderAssetPreviews();
                };
                reader.readAsDataURL(file);
            });
        }

        function removeAsset(name) {
            delete customAssets[name];
            localStorage.setItem('customAssets', JSON.stringify(customAssets));
            renderAssetPreviews();
        }

        function renderAssetPreviews() {
            const list = document.getElementById('assetPreviewList');
            list.innerHTML = '';
            Object.keys(customAssets).forEach(name => {
                const item = document.createElement('div');
                item.className = 'asset-item';
                item.innerHTML = `
                    <img src="${customAssets[name]}">
                    <span>${name}</span>
                    <button class="btn-remove-asset" onclick="removeAsset('${name}')">Remover</button>
                `;
                list.appendChild(item);
            });
        }

        // --- GAME LOGIC ---
        function setupMobileButtons() {
            const bind = (id, key) => {
                const el = document.getElementById(id);
                const start = (e) => { e.preventDefault(); mobileState[key] = true; };
                const end = (e) => { e.preventDefault(); mobileState[key] = false; };
                el.addEventListener('touchstart', start);
                el.addEventListener('touchend', end);
                el.addEventListener('mousedown', start);
                el.addEventListener('mouseup', end);
            };
            bind('btnLeft', 'left'); bind('btnRight', 'right'); bind('btnJump', 'jump');
        }

        function renderGamesGrid() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            gamesConfig.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-thumbnail">${game.emoji}</div>
                    <div class="game-info">
                        <h3>${game.name}</h3>
                        <p>${game.description}</p>
                        <div class="game-buttons">
                            <button class="btn-play" onclick="playGame('${game.id}')">▶ Jogar</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function playGame(gameId) {
            currentGame = gamesConfig.find(g => g.id === gameId);
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameContainer').classList.add('active');
            document.getElementById('gameUI').style.display = 'block';
            if (window.innerWidth <= 768) document.getElementById('mobileControls').classList.add('active');

            if (gameInstance) gameInstance.destroy(true);
            
            const config = {
                type: Phaser.AUTO,
                width: 1280, height: 720,
                parent: 'gameContainer',
                scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
                physics: { default: 'arcade', arcade: { gravity: { y: currentGame.settings.gravity } } },
                scene: { preload, create, update },
            };
            gameInstance = new Phaser.Game(config);
        }

        function preload() {
            if (customAssets['player']) {
                this.load.image('customPlayer', customAssets['player']);
            }

            let graphics = this.make.graphics({ x: 0, y: 0, add: false });
            graphics.fillStyle(0xffffff); graphics.fillCircle(30, 30, 30);
            graphics.generateTexture('playerTexture', 60, 60);
            graphics.clear();
            
            const fw = 64, fh = 64;
            for (let i = 0; i < 4; i++) {
                graphics.lineStyle(4, 0xffffff);
                let x = i * fw + fw/2, y = fh/2;
                graphics.strokeCircle(x, y - 15, 10);
                graphics.lineBetween(x, y - 5, x, y + 15);
                if (i === 0) { // Idle
                    graphics.lineBetween(x, y + 15, x - 10, y + 30); graphics.lineBetween(x, y + 15, x + 10, y + 30);
                    graphics.lineBetween(x, y, x - 15, y + 10); graphics.lineBetween(x, y, x + 15, y + 10);
                } else if (i === 1) { // Walk 1
                    graphics.lineBetween(x, y + 15, x - 5, y + 30); graphics.lineBetween(x, y + 15, x + 15, y + 25);
                    graphics.lineBetween(x, y, x - 10, y + 15); graphics.lineBetween(x, y, x + 10, y + 5);
                } else if (i === 2) { // Walk 2
                    graphics.lineBetween(x, y + 15, x + 5, y + 30); graphics.lineBetween(x, y + 15, x - 15, y + 25);
                    graphics.lineBetween(x, y, x + 10, y + 15); graphics.lineBetween(x, y, x - 10, y + 5);
                } else if (i === 3) { // Jump
                    graphics.lineBetween(x, y + 15, x - 15, y + 10); graphics.lineBetween(x, y + 15, x + 15, y + 10);
                    graphics.lineBetween(x, y, x - 20, y - 10); graphics.lineBetween(x, y, x + 20, y - 10);
                }
            }
            graphics.generateTexture('stickmanSheet', fw * 4, fh);
            graphics.clear();
            
            graphics.fillStyle(0xffffff); graphics.fillRect(0, 0, 100, 20);
            graphics.generateTexture('platformTexture', 100, 20);
        }

        function create() {
            const settings = currentGame.settings;
            const platforms = this.physics.add.staticGroup();
            const worldWidth = 1280, worldHeight = 720;

            for (let x = 0; x < worldWidth; x += 100) {
                platforms.create(x, worldHeight - 20, 'platformTexture').setOrigin(0, 0).refreshBody()
                    .setTint(Phaser.Display.Color.HexStringToColor(settings.platformColor).color);
            }

            for (let i = 0; i < settings.platformCount; i++) {
                const x = 200 + Math.random() * (worldWidth - 400), y = 200 + Math.random() * (worldHeight - 400);
                platforms.create(x, y, 'platformTexture').setOrigin(0, 0).refreshBody()
                    .setTint(Phaser.Display.Color.HexStringToColor(settings.platformColor).color);
            }

            if (currentGame.id === 'custom-game' && customAssets['player']) {
                this.player = this.physics.add.sprite(100, 450, 'customPlayer');
            } else if (currentGame.type === 'stickman') {
                let tex = this.textures.get('stickmanSheet');
                for(let i=0; i<4; i++) tex.add(i, 0, i*64, 0, 64, 64);
                if (!this.anims.exists('idle')) {
                    this.anims.create({ key: 'idle', frames: [{ key: 'stickmanSheet', frame: 0 }], frameRate: 1 });
                    this.anims.create({ key: 'walk', frames: [{ key: 'stickmanSheet', frame: 1 }, { key: 'stickmanSheet', frame: 2 }], frameRate: 8, repeat: -1 });
                    this.anims.create({ key: 'jump', frames: [{ key: 'stickmanSheet', frame: 3 }], frameRate: 1 });
                }
                this.player = this.physics.add.sprite(100, 450, 'stickmanSheet', 0);
            } else {
                this.player = this.physics.add.sprite(100, 450, 'playerTexture');
            }

            this.player.setBounce(0.1).setCollideWorldBounds(true)
                .setTint(Phaser.Display.Color.HexStringToColor(settings.playerColor).color);

            this.physics.add.collider(this.player, platforms);
            this.cursors = this.input.keyboard.createCursorKeys();
            this.keys = this.input.keyboard.addKeys('W,A,S,D,SPACE');
            this.cameras.main.setBackgroundColor(settings.backgroundColor);
            this.cameras.main.setBounds(0, 0, worldWidth, worldHeight);
            this.cameras.main.startFollow(this.player);
        }

        function update() {
            if (!this.player) return;
            const player = this.player, keys = this.keys, cursors = this.cursors, settings = currentGame.settings;
            let moving = false;

            if (keys.A.isDown || cursors.left.isDown || mobileState.left) {
                player.setVelocityX(-settings.playerSpeed);
                player.setFlipX(true); moving = true;
            } else if (keys.D.isDown || cursors.right.isDown || mobileState.right) {
                player.setVelocityX(settings.playerSpeed);
                player.setFlipX(false); moving = true;
            } else {
                player.setVelocityX(0);
            }

            if ((keys.SPACE.isDown || cursors.up.isDown || keys.W.isDown || mobileState.jump) && player.body.touching.down) {
                player.setVelocityY(-settings.jumpForce);
            }

            if (currentGame.type === 'stickman' && !customAssets['player']) {
                if (!player.body.touching.down) player.play('jump', true);
                else if (moving) player.play('walk', true);
                else player.play('idle', true);
            }
        }

        function backToMenu() {
            document.getElementById('gameContainer').classList.remove('active');
            document.getElementById('gameUI').style.display = 'none';
            document.getElementById('mobileControls').classList.remove('active');
            document.getElementById('mainMenu').classList.remove('hidden');
            if (gameInstance) { gameInstance.destroy(true); gameInstance = null; }
        }

        setupMobileButtons();
        renderGamesGrid();
        renderAssetPreviews();
    </script>
</body>
</html>
