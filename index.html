<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Launcher - Square Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* MENU PRINCIPAL */
        #mainMenu {
            display: block;
        }
        
        #mainMenu.hidden {
            display: none;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .game-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .game-thumbnail {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 50px;
        }
        
        .game-info {
            padding: 15px;
        }
        
        .game-info h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #333;
        }
        
        .game-info p {
            color: #666;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .game-buttons {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            font-size: 14px;
            touch-action: manipulation;
        }
        
        .btn-play {
            background: #667eea;
            color: white;
        }
        
        .btn-play:hover {
            background: #5568d3;
        }
        
        .btn-edit {
            background: #48bb78;
            color: white;
        }
        
        .btn-edit:hover {
            background: #38a169;
        }
        
        .btn-back {
            background: #e53e3e;
            color: white;
            margin-top: 10px;
        }
        
        /* GAME CONTAINER */
        #gameContainer {
            display: none;
            background: black;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            margin: 0 auto 10px;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16/9;
        }
        
        #gameContainer.active {
            display: block;
        }
        
        canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }
        
        .game-ui {
            background: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            max-width: 1280px;
            margin: 0 auto;
        }
        
        .controls-info {
            color: #666;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        /* MOBILE CONTROLS */
        #mobileControls {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            z-index: 1000;
            justify-content: space-between;
            pointer-events: none;
        }
        
        .mobile-btn-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        
        .m-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            backdrop-filter: blur(5px);
            -webkit-tap-highlight-color: transparent;
        }
        
        .m-btn:active {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(0.9);
        }
        
        @media (max-width: 768px) {
            #mobileControls.active {
                display: flex;
            }
            .controls-info {
                display: none;
            }
            .header h1 {
                font-size: 28px;
            }
        }
        
        /* EDITOR */
        #editorPanel {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        #editorPanel.active {
            display: block;
        }
        
        .editor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .editor-item {
            background: #f7fafc;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
        }
        
        #previewCanvas {
            width: 100%;
            height: auto;
            border-radius: 8px;
            background: #87ceeb;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- MENU PRINCIPAL -->
        <div id="mainMenu">
            <div class="header">
                <h1>🎮 Game Launcher</h1>
                <p>Selecione um jogo para jogar ou editar</p>
            </div>
            <div class="games-grid" id="gamesGrid"></div>
        </div>
        
        <!-- GAME AREA -->
        <div id="gameContainer"></div>
        <div class="game-ui" id="gameUI" style="display: none;">
            <p class="controls-info">Use <strong>WASD</strong> ou <strong>Setas</strong> para mover | <strong>ESPAÇO</strong> para pular</p>
            <button class="btn-back" onclick="backToMenu()">← Voltar ao Menu</button>
        </div>
        
        <!-- MOBILE CONTROLS -->
        <div id="mobileControls">
            <div class="mobile-btn-group">
                <div class="m-btn" id="btnLeft">⬅️</div>
                <div class="m-btn" id="btnRight">➡️</div>
            </div>
            <div class="mobile-btn-group">
                <div class="m-btn" id="btnJump">⬆️</div>
            </div>
        </div>
        
        <!-- EDITOR PANEL -->
        <div id="editorPanel">
            <div class="editor-header">
                <h2 id="editorTitle">Editar Jogo</h2>
                <p id="editorDescription"></p>
            </div>
            <div class="editor-grid" id="editorGrid"></div>
            <div class="preview-container">
                <canvas id="previewCanvas" width="600" height="300"></canvas>
            </div>
            <div class="editor-buttons">
                <button class="btn-save" onclick="saveGameConfig()">💾 Salvar</button>
                <button class="btn-cancel" onclick="cancelEdit()">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <script>
        const gamesConfig = [
            {
                id: 'blue-ball',
                name: 'Blue Ball Platformer',
                description: 'Pule sobre as plataformas com a bola azul (Original)',
                emoji: '🔵',
                type: 'ball',
                settings: {
                    playerColor: '#0000ff',
                    platformColor: '#8b7355',
                    backgroundColor: '#87ceeb',
                    gravity: 1050,
                    playerSpeed: 400,
                    jumpForce: 717,
                    platformCount: 3,
                    difficulty: 'normal'
                }
            },
            {
                id: 'custom-game',
                name: 'Custom Platformer',
                description: 'Uma cópia com Boneco Palito animado!',
                emoji: '🛠️',
                type: 'stickman',
                settings: {
                    playerColor: '#ff0000',
                    platformColor: '#4a5568',
                    backgroundColor: '#a0aec0',
                    gravity: 1050,
                    playerSpeed: 400,
                    jumpForce: 717,
                    platformCount: 5,
                    difficulty: 'normal'
                }
            }
        ];

        let currentGame = null;
        let gameInstance = null;
        let editingGame = null;
        
        // Estado dos botões mobile
        const mobileState = { left: false, right: false, jump: false };

        function setupMobileButtons() {
            const bind = (id, key) => {
                const el = document.getElementById(id);
                const start = (e) => { e.preventDefault(); mobileState[key] = true; };
                const end = (e) => { e.preventDefault(); mobileState[key] = false; };
                el.addEventListener('touchstart', start);
                el.addEventListener('touchend', end);
                el.addEventListener('mousedown', start);
                el.addEventListener('mouseup', end);
                el.addEventListener('mouseleave', end);
            };
            bind('btnLeft', 'left');
            bind('btnRight', 'right');
            bind('btnJump', 'jump');
        }

        function renderGamesGrid() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            gamesConfig.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-thumbnail">${game.emoji}</div>
                    <div class="game-info">
                        <h3>${game.name}</h3>
                        <p>${game.description}</p>
                        <div class="game-buttons">
                            <button class="btn-play" onclick="playGame('${game.id}')">▶ Jogar</button>
                            <button class="btn-edit" onclick="editGame('${game.id}')">✎ Editar</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function playGame(gameId) {
            currentGame = gamesConfig.find(g => g.id === gameId);
            if (!currentGame) return;

            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameContainer').classList.add('active');
            document.getElementById('gameUI').style.display = 'block';
            
            if (window.innerWidth <= 768) {
                document.getElementById('mobileControls').classList.add('active');
            }

            if (gameInstance) {
                gameInstance.destroy(true);
                gameInstance = null;
            }

            const config = {
                type: Phaser.AUTO,
                width: 1280,
                height: 720,
                parent: 'gameContainer',
                scale: {
                    mode: Phaser.Scale.FIT,
                    autoCenter: Phaser.Scale.CENTER_BOTH
                },
                physics: {
                    default: 'arcade',
                    arcade: {
                        gravity: { y: currentGame.settings.gravity },
                        debug: false,
                    },
                },
                scene: { preload, create, update },
            };

            gameInstance = new Phaser.Game(config);
        }

        function preload() {
            let graphics = this.make.graphics({ x: 0, y: 0, add: false });
            
            // Textura da bola
            graphics.fillStyle(0xffffff);
            graphics.fillCircle(30, 30, 30);
            graphics.generateTexture('playerTexture', 60, 60);
            graphics.clear();
            
            // Stickman Spritesheet
            const fw = 64, fh = 64;
            for (let i = 0; i < 4; i++) {
                graphics.lineStyle(4, 0xffffff);
                let x = i * fw + fw/2, y = fh/2;
                graphics.strokeCircle(x, y - 15, 10); // Cabeça
                graphics.lineBetween(x, y - 5, x, y + 15); // Corpo
                if (i === 0) { // Idle
                    graphics.lineBetween(x, y + 15, x - 10, y + 30); graphics.lineBetween(x, y + 15, x + 10, y + 30);
                    graphics.lineBetween(x, y, x - 15, y + 10); graphics.lineBetween(x, y, x + 15, y + 10);
                } else if (i === 1) { // Walk 1
                    graphics.lineBetween(x, y + 15, x - 5, y + 30); graphics.lineBetween(x, y + 15, x + 15, y + 25);
                    graphics.lineBetween(x, y, x - 10, y + 15); graphics.lineBetween(x, y, x + 10, y + 5);
                } else if (i === 2) { // Walk 2
                    graphics.lineBetween(x, y + 15, x + 5, y + 30); graphics.lineBetween(x, y + 15, x - 15, y + 25);
                    graphics.lineBetween(x, y, x + 10, y + 15); graphics.lineBetween(x, y, x - 10, y + 5);
                } else if (i === 3) { // Jump
                    graphics.lineBetween(x, y + 15, x - 15, y + 10); graphics.lineBetween(x, y + 15, x + 15, y + 10);
                    graphics.lineBetween(x, y, x - 20, y - 10); graphics.lineBetween(x, y, x + 20, y - 10);
                }
            }
            graphics.generateTexture('stickmanSheet', fw * 4, fh);
            graphics.clear();
            
            // Plataforma
            graphics.fillStyle(0xffffff);
            graphics.fillRect(0, 0, 100, 20);
            graphics.generateTexture('platformTexture', 100, 20);
        }

        function create() {
            const settings = currentGame.settings;
            const platforms = this.physics.add.staticGroup();
            const worldWidth = 1280, worldHeight = 720;

            for (let x = 0; x < worldWidth; x += 100) {
                platforms.create(x, worldHeight - 20, 'platformTexture').setOrigin(0, 0).refreshBody()
                    .setTint(Phaser.Display.Color.HexStringToColor(settings.platformColor).color);
            }

            for (let i = 0; i < settings.platformCount; i++) {
                const x = 200 + Math.random() * (worldWidth - 400), y = 200 + Math.random() * (worldHeight - 400);
                platforms.create(x, y, 'platformTexture').setOrigin(0, 0).refreshBody()
                    .setTint(Phaser.Display.Color.HexStringToColor(settings.platformColor).color);
            }

            if (currentGame.type === 'stickman') {
                let tex = this.textures.get('stickmanSheet');
                for(let i=0; i<4; i++) tex.add(i, 0, i*64, 0, 64, 64);
                
                if (!this.anims.exists('idle')) {
                    this.anims.create({ key: 'idle', frames: [{ key: 'stickmanSheet', frame: 0 }], frameRate: 1 });
                    this.anims.create({ key: 'walk', frames: [{ key: 'stickmanSheet', frame: 1 }, { key: 'stickmanSheet', frame: 2 }], frameRate: 8, repeat: -1 });
                    this.anims.create({ key: 'jump', frames: [{ key: 'stickmanSheet', frame: 3 }], frameRate: 1 });
                }
                this.player = this.physics.add.sprite(100, 450, 'stickmanSheet', 0);
            } else {
                this.player = this.physics.add.sprite(100, 450, 'playerTexture');
            }

            this.player.setBounce(0.1).setCollideWorldBounds(true)
                .setTint(Phaser.Display.Color.HexStringToColor(settings.playerColor).color);

            this.physics.add.collider(this.player, platforms);
            this.cursors = this.input.keyboard.createCursorKeys();
            this.keys = this.input.keyboard.addKeys('W,A,S,D,SPACE');
            this.cameras.main.setBackgroundColor(settings.backgroundColor);
            this.cameras.main.setBounds(0, 0, worldWidth, worldHeight);
            this.cameras.main.startFollow(this.player);
        }

        function update() {
            if (!this.player) return;
            const player = this.player, keys = this.keys, cursors = this.cursors, settings = currentGame.settings;
            let moving = false;

            if (keys.A.isDown || cursors.left.isDown || mobileState.left) {
                player.setVelocityX(-settings.playerSpeed);
                player.setFlipX(true);
                moving = true;
            } else if (keys.D.isDown || cursors.right.isDown || mobileState.right) {
                player.setVelocityX(settings.playerSpeed);
                player.setFlipX(false);
                moving = true;
            } else {
                player.setVelocityX(0);
            }

            if ((keys.SPACE.isDown || cursors.up.isDown || keys.W.isDown || mobileState.jump) && player.body.touching.down) {
                player.setVelocityY(-settings.jumpForce);
            }

            if (currentGame.type === 'stickman') {
                if (!player.body.touching.down) player.play('jump', true);
                else if (moving) player.play('walk', true);
                else player.play('idle', true);
            }
        }

        function backToMenu() {
            document.getElementById('gameContainer').classList.remove('active');
            document.getElementById('gameUI').style.display = 'none';
            document.getElementById('mobileControls').classList.remove('active');
            document.getElementById('mainMenu').classList.remove('hidden');
            if (gameInstance) { gameInstance.destroy(true); gameInstance = null; }
        }

        function editGame(gameId) {
            editingGame = gamesConfig.find(g => g.id === gameId);
            if (!editingGame) return;
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('editorPanel').classList.add('active');
            renderEditorGrid();
            updatePreview();
        }

        function renderEditorGrid() {
            const grid = document.getElementById('editorGrid'), s = editingGame.settings;
            grid.innerHTML = `
                <div class="editor-item"><label>Cor Jogador</label><input type="color" id="pCol" value="${s.playerColor}" onchange="updatePreview()"></div>
                <div class="editor-item"><label>Cor Plataforma</label><input type="color" id="platCol" value="${s.platformColor}" onchange="updatePreview()"></div>
                <div class="editor-item"><label>Cor Fundo</label><input type="color" id="bgCol" value="${s.backgroundColor}" onchange="updatePreview()"></div>
                <div class="editor-item"><label>Gravidade</label><input type="range" id="grav" min="500" max="2000" value="${s.gravity}" onchange="updatePreview()"></div>
                <div class="editor-item"><label>Velocidade</label><input type="range" id="speed" min="200" max="800" value="${s.playerSpeed}" onchange="updatePreview()"></div>
            `;
        }

        function updatePreview() {
            const canvas = document.getElementById('previewCanvas'), ctx = canvas.getContext('2d');
            const pCol = document.getElementById('pCol').value, platCol = document.getElementById('platCol').value, bgCol = document.getElementById('bgCol').value;
            ctx.fillStyle = bgCol; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = platCol; ctx.fillRect(50, 250, 200, 20);
            ctx.fillStyle = pCol;
            if (editingGame.type === 'stickman') {
                ctx.strokeStyle = pCol; ctx.lineWidth = 3; let x = 100, y = 150;
                ctx.beginPath(); ctx.arc(x, y - 15, 8, 0, Math.PI * 2); ctx.moveTo(x, y - 7); ctx.lineTo(x, y + 10);
                ctx.moveTo(x, y + 10); ctx.lineTo(x - 10, y + 25); ctx.moveTo(x, y + 10); ctx.lineTo(x + 10, y + 25);
                ctx.moveTo(x, y); ctx.lineTo(x - 15, y + 10); ctx.moveTo(x, y); ctx.lineTo(x + 15, y + 10); ctx.stroke();
            } else {
                ctx.beginPath(); ctx.arc(100, 150, 20, 0, Math.PI * 2); ctx.fill();
            }
        }

        function saveGameConfig() {
            editingGame.settings.playerColor = document.getElementById('pCol').value;
            editingGame.settings.platformColor = document.getElementById('platCol').value;
            editingGame.settings.backgroundColor = document.getElementById('bgCol').value;
            editingGame.settings.gravity = parseInt(document.getElementById('grav').value);
            editingGame.settings.playerSpeed = parseInt(document.getElementById('speed').value);
            cancelEdit();
        }

        function cancelEdit() {
            document.getElementById('editorPanel').classList.remove('active');
            document.getElementById('mainMenu').classList.remove('hidden');
        }

        setupMobileButtons();
        renderGamesGrid();
    </script>
</body>
</html>
